# =====================================================================
# Đề 40 - Nginx Reverse Proxy (unprivileged, chạy non-root trong container)
# File: deployment/nginx.conf
#
# - Nhận HTTP :8080  -> redirect sang HTTPS (trừ /healthz và /nginx_status)
# - Nhận HTTPS:8443  -> proxy tới Node.js/Express (app:3000)
# - Gzip, proxy buffers, timeout, rate limiting 5 req/s
# - server_tokens off + security headers (CSP, X-Frame-Options, ...)
# - /nginx_status dành riêng cho nginx-prometheus-exporter (IP nội bộ)
#
# Cổng nội bộ 8080/8443 vì container chạy bằng user nginx (không có quyền
# bind cổng < 1024). Docker Compose map 80:8080 và 443:8443 ra ngoài.
# =====================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Ẩn phiên bản Nginx trong header/error page
    server_tokens off;

    # Thư mục tạm nằm trong tmpfs (container chạy read-only)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log JSON để Promtail parse bằng pipeline `json` (xem deployment/promtail)
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"request_id":"$request_id"'
      '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;
    reset_timedout_connection on;
    types_hash_max_size  2048;
    server_names_hash_bucket_size 64;

    # ---------------- Gzip ----------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/manifest+json
        font/woff2;

    # ---------------- Rate limiting (~5 request/giây/IP) ----------------
    limit_req_zone  $binary_remote_addr zone=app_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------------- Proxy tới ứng dụng Node.js ----------------
    upstream appointment_app {
        server app:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    proxy_buffering            on;
    proxy_buffer_size          16k;
    proxy_buffers              16 16k;
    proxy_busy_buffers_size    32k;
    proxy_connect_timeout      5s;
    proxy_send_timeout         60s;
    proxy_read_timeout         60s;
    proxy_next_upstream        error timeout http_502 http_503 http_504;

    # Không để lộ header của ứng dụng Node.js ra ngoài.
    proxy_hide_header X-Powered-By;

    # ---------------- Cấu hình TLS dùng chung cho mọi server block ----------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # =================================================================
    # HTTP :8080 - healthcheck nội bộ + stub_status + redirect sang HTTPS
    # =================================================================
    server {
        listen      8080 default_server;
        server_name _;

        limit_conn conn_limit 30;

        # Healthcheck cho Docker / load balancer (không ghi access log)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Stub status chỉ cho phép IP nội bộ (nginx-prometheus-exporter)
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =================================================================
    # HTTPS :8443 - phục vụ website + API qua reverse proxy
    # =================================================================
    server {
        listen      8443 ssl;
        http2       on;
        server_name _;

        ssl_certificate         /etc/nginx/certs/server.crt;
        ssl_certificate_key     /etc/nginx/certs/server.key;

        limit_conn conn_limit 30;

        # ---------------- Security headers ----------------
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # /metrics chỉ Prometheus scrape trực tiếp từ network monitoring
        location = /metrics {
            access_log off;
            return 404;
        }

        # Chặn truy cập file ẩn (.git, .env, ...)
        location ~ /\. {
            deny all;
            return 404;
        }

        # ---------------- API: rate limit chặt hơn ----------------
        location /api/auth/ {
            limit_req zone=app_limit burst=5 nodelay;

            proxy_pass http://appointment_app;
        }

        location /api/ {
            limit_req zone=app_limit burst=10 nodelay;

            proxy_pass http://appointment_app;
        }

        # ---------------- Website tĩnh / SPA ----------------
        location / {
            limit_req zone=app_limit burst=30 nodelay;

            proxy_pass http://appointment_app;
        }

        # Trang lỗi mặc định
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            default_type text/html;
            return 503 '<!doctype html><html lang="vi"><meta charset="utf-8"><title>Dich vu tam thoi gian doan</title><body><h1>503 - Dich vu tam thoi gian doan</h1><p>Vui long thu lai sau it phut.</p></body></html>';
        }
    }
}

