# =====================================================================
# Promtail - thu thập log và đẩy về Loki
#  - Nginx access log (JSON) + error log
#  - Ứng dụng Node.js (pino JSON) trong volume app_logs
# Labels: job, service, env, log_type, level, method, status
# (Không dùng label có cardinality cao như uri/request_id để tránh
#  làm phình index của Loki; các field này vẫn nằm trong log line.)
# =====================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # ---------------- Nginx access log ----------------
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          env: production
          log_type: access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            remote_addr: remote_addr
            method: method
            uri: uri
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_response_time: upstream_response_time
            request_id: request_id
      - timestamp:
          source: time
          format: RFC3339Nano
      # Chuyển status (number) sang chuỗi để dùng làm label
      - template:
          source: status_code
          template: '{{ .status }}'
      - template:
          source: level
          template: '{{ if ge .status 500.0 }}error{{ else if ge .status 400.0 }}warn{{ else }}info{{ end }}'
      - labels:
          method:
          status_code:
          level:
      # Bỏ các field đã thành label để log line gọn hơn
      - labeldrop:
          - filename

  # ---------------- Nginx error log ----------------
  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          env: production
          log_type: error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)$'
      - timestamp:
          source: time
          format: '2006/01/02 15:04:05'
      # Loki chỉ chấp nhận level: trace|debug|info|warn|error|critical|fatal.
      # Nginx dùng crit/alert/emerg/notice nên cần ánh xạ lại.
      - template:
          source: level
          template: '{{ $l := .level }}{{ if or (eq $l "crit") (eq $l "alert") (eq $l "emerg") }}critical{{ else if eq $l "notice" }}info{{ else }}{{ $l }}{{ end }}'
      - labels:
          level:

  # ---------------- Node.js application log (pino JSON) ----------------
  - job_name: appointment-app
    static_configs:
      - targets: [localhost]
        labels:
          job: appointment-app
          service: appointment-web
          env: production
          log_type: app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            method: req.method
            uri: req.url
            status_code: res.statusCode
            req_id: req.id
            error_msg: err.message
      - timestamp:
          source: time
          format: RFC3339Nano
      # pino được cấu hình formatters.level => "info"/"warn"/"error"/"fatal"
      - labels:
          level:
      - labeldrop:
          - filename
