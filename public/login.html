<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập · Đặt lịch hẹn</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-wrap">
    <main class="auth-card">
      <a class="brand" href="index.html"><span class="brand-mark">Đ</span> Đặt lịch hẹn</a>
      <h1>Đăng nhập</h1>
      <p class="muted small">Sử dụng tài khoản đã đăng ký để đặt và quản lý lịch hẹn.</p>

      <div class="alert alert-error" id="form-alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
            placeholder="ban@example.com"
          />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            maxlength="72"
            placeholder="••••••••"
          />
        </div>
        <button class="btn btn-block" type="submit" id="login-submit">Đăng nhập</button>
      </form>

      <p class="auth-foot">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a><br />
        <a href="index.html">← Về trang đặt lịch</a>
      </p>

      <div class="demo-box">
        <strong>Tài khoản demo:</strong><br />
        Quản trị: <code>admin@appointment.local</code> / <code>Admin@12345</code><br />
        Khách hàng: <code>customer1@example.com</code> / <code>Demo@12345</code>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
